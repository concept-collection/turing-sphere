name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=optional  # skip the prebuilt Dawn binaries; CI does not benchmark
      - run: npm run test:node
      # headless Chrome + SwiftShader software WebGPU
      - run: npm run test:gpu
        env:
          CHROME_PATH: /usr/bin/google-chrome
